[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musac_las_classifier"
version = "0.1.0"
description = "Classifier for LAS point cloud files using 3D to 2D model"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Alexey Kozhakin", email = "alexeykozhakin@gmail.com"}
]
dependencies = [
    "laspy>=2.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python>=4.8",
    "Pillow>=9.5",
    "pyshp>=2.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "segmentation-models-pytorch>=0.3",
    "tqdm>=4.64"
]

[project.urls]
"Homepage" = "https://github.com/AlexeyKozhakin/lidar-visual-interface"
