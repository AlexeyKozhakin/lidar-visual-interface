[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musac_las_classifier"
version = "0.1.0"
description = "Classifier for LAS point cloud files using 3D to 2D model"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Alexey Kozhakin", email = "alexeykozhakin@gmail.com"}
]
dependencies = [
    "laspy>=2.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python>=4.8",
    "Pillow>=9.5",
    "pyshp>=2.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "segmentation-models-pytorch>=0.3",
    "tqdm>=4.64"
]
[tool.setuptools.packages.find]
where = [""]
include = ["musac_las_classifier*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"musac_las_classifier" = [
    "models/*.pt",
    "models/**/*.pt",
    "models/**",
    "predictor_building_segmentation/model/*.pth",
    "predictor_building_segmentation/model/**/*.pth",
    "predictor_building_segmentation/model/**",
    "predictor_multiclass_segmentation/model/*.pth",
    "predictor_multiclass_segmentation/model/**/*.pth",
    "predictor_multiclass_segmentation/model/**",
    "data/**",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.txt",
]
[project.urls]
"Homepage" = "https://github.com/AlexeyKozhakin/lidar-visual-interface"
