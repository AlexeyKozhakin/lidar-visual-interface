[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "musac-las-classifier"
version = "0.2.0"
description = "End-to-end LiDAR point cloud classification pipeline: 3D LAS to 2D segmentation and back"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Alexey Kozhakin", email = "alexeykozhakin@gmail.com"},
]
dependencies = [
    "laspy>=2.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "pyshp>=2.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "segmentation-models-pytorch>=0.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
training = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "plyfile>=1.0",
]

[project.scripts]
musac-classify = "musac_las_classifier.cli:classify"
musac-polygons = "musac_las_classifier.cli:polygons"

[project.urls]
Homepage = "https://github.com/AlexeyKozhakin/lidar-visual-interface"

[tool.setuptools.packages.find]
include = ["musac_las_classifier*"]
